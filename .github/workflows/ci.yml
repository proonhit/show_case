name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Showcase.slnx

      - name: Build
        run: dotnet build Showcase.slnx --no-restore -c Release

      - name: Test (uses Docker for PostgreSQL via Testcontainers)
        run: dotnet test Showcase.slnx --no-build -c Release --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Backend tests
          path: backend/TestResults/*.trx
          reporter: dotnet-trx
