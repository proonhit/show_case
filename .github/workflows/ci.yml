name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Showcase.slnx

      - name: Build
        run: dotnet build Showcase.slnx --no-restore -c Release

      - name: Test (uses Docker for PostgreSQL via Testcontainers)
        run: dotnet test Showcase.slnx --no-build -c Release --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Backend tests
          path: backend/TestResults/*.trx
          reporter: dotnet-trx

  frontend:
    name: Frontend typecheck, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install --no-frozen-lockfile; fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  docker-smoke:
    name: Docker stack smoke test + Studio & Showcase e2e
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - name: Build API image and make deploy/.env
        run: |
          docker build --target api -t showcase-api:dev backend
          HASH=$(docker run --rm showcase-api:dev hash-password smoke-password)
          cp deploy/.env.example deploy/.env
          sed -i "s|^ADMIN_PASSWORD_HASH=.*|ADMIN_PASSWORD_HASH=$HASH|" deploy/.env

      - name: Start PostgreSQL + API + Worker
        run: docker compose -f deploy/docker-compose.dev.yml --env-file deploy/.env up -d --build

      - name: Log in, create a model, upload 100 MB with tus
        run: deploy/smoke-test.sh http://localhost:5080 smoke-password

      - name: Worker picked up the job
        run: |
          for i in $(seq 30); do
            docker compose -f deploy/docker-compose.dev.yml --env-file deploy/.env logs worker | grep -q "Received glb" && exit 0
            sleep 2
          done
          echo "Worker did not process the upload"; exit 1

      # Studio end-to-end in a real browser against the same stack.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Studio e2e (Playwright)
        working-directory: frontend
        env:
          E2E_PASSWORD: smoke-password
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @showcase/studio build
          pnpm --filter @showcase/studio exec playwright install --with-deps chromium
          pnpm --filter @showcase/studio e2e

      # The public site, built from what the Studio e2e just published.
      - name: Showcase build from the API + e2e (Playwright)
        working-directory: frontend
        env:
          API_URL: http://localhost:5080
          SITE_URL: https://showcase.example
        run: |
          pnpm --filter @showcase/showcase build
          pnpm --filter @showcase/showcase e2e

      # Mobile Lighthouse on the generated pages (scores in the job summary). Bar: performance ≥ 85.
      - name: Lighthouse (mobile)
        working-directory: frontend/apps/showcase
        env:
          LH_ENFORCE: '1'
        run: |
          export CHROME_PATH=$(cd ../studio && node -e "console.log(require('@playwright/test').chromium.executablePath())")
          node scripts/serve.mjs & sleep 1
          slug=$(node -e "const s=require('./data/site.json'); console.log((s.models.find(m=>m.modelUrl)||s.models[0]).slug)")
          node scripts/lighthouse.mjs http://localhost:5175/en "http://localhost:5175/en/models/$slug#report" http://localhost:5175/vi/about

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e
          path: |
            frontend/apps/studio/test-results/
            frontend/apps/studio/playwright-report/
            frontend/apps/showcase/test-results/
            frontend/apps/showcase/playwright-report/
          retention-days: 14

      - name: Logs
        if: always()
        run: docker compose -f deploy/docker-compose.dev.yml --env-file deploy/.env logs --no-color --tail 200
