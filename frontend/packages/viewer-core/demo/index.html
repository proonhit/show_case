<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>viewer-core demo</title>
<style>
  :root { color-scheme: dark; --bg:#0E0F12; --surface:#16181D; --border:#2A2E37; --text:#F2F3F5; --muted:#9AA0AB; --accent:#FF8A3D; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--border); }
  header button, header select { padding: 4px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); font: inherit; cursor: pointer; }
  #stage { position: relative; flex: 1; min-height: 0; }
  #hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); pointer-events: none; text-align: center; padding: 16px; }
  #modes { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; padding: 4px; max-width: calc(100% - 32px); border-radius: 12px; background: var(--surface); border: 1px solid var(--border); }
  #modes button { padding: 6px 10px; border: 0; border-radius: 8px; background: none; color: var(--text); font: inherit; cursor: pointer; }
  #modes button[aria-pressed="true"] { background: var(--accent); color: #15110E; }
  #modes button:disabled { color: var(--muted); opacity: .45; cursor: not-allowed; }
  #progress { position: absolute; left: 0; top: 0; height: 3px; background: var(--accent); width: 0; transition: width .2s; }
  #info { color: var(--muted); font-family: ui-monospace, monospace; font-size: 12px; }
</style>
</head>
<body>
<header>
  <label>Model <input id="file" type="file" accept=".glb,.gltf"></label>
  <button id="spin" aria-pressed="true">Turntable</button>
  <button id="reset">Reset view</button>
  <button id="full">Fullscreen</button>
  <select id="lang" aria-label="Language"><option value="en">EN</option><option value="vi">VI</option></select>
  <span id="info">Drop a .glb anywhere, or add ?src=url · keys 1–7 switch map mode</span>
</header>
<div id="stage">
  <div id="progress"></div>
  <div id="hint">Drop a .glb file here</div>
  <div id="modes" role="group" aria-label="Map mode"></div>
</div>
<script type="module" src="./main.ts"></script>
</body>
</html>
